<main class="payment-shell">
  <section class="payment-card">
    <p class="eyebrow">Paiement s&eacute;curis&eacute;</p>
    <h1>Finaliser votre analyse</h1>

    <div class="loader" *ngIf="isLoading" role="status"><span class="spinner"></span><span>Cr&eacute;ation de la commande PayPal...</span></div>
    <div class="error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>

    <ng-container *ngIf="order">
      <div class="price">{{ order.amount }} {{ order.currency }} <small>PayPal Sandbox</small></div>
      <a class="paypal" [href]="order.approvalUrl" target="_blank" rel="noopener">1. Ouvrir PayPal Sandbox</a>
      <button class="confirm" [disabled]="isConfirming" (click)="confirmPayment()">{{ isConfirming ? 'V&eacute;rification en cours...' : '2. Confirmer le paiement' }}</button>
      <p class="hint">Apr&egrave;s l&#39;approbation dans PayPal, revenez ici puis cliquez sur le bouton de v&eacute;rification.</p>
    </ng-container>

    <button class="skip" *ngIf="allowPaymentSkip" [disabled]="isConfirming" (click)="continueWithoutPayment()">Continuer sans paiement (d&eacute;veloppement)</button>
    <button class="cancel" [disabled]="isConfirming" (click)="cancel()">Annuler</button>
  </section>
</main>
