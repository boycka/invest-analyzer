<div class="analysis-container">
  <div class="form-heading">
    <p class="eyebrow">Diagnostic intelligent</p>
    <h1>Analyse de projet IA</h1>
    <p class="intro">Renseignez les informations essentielles de votre projet pour obtenir une analyse claire et actionnable.</p>
  </div>

  <div class="analysis-loading" *ngIf="isSubmitting" role="status" aria-live="polite">
    <div class="spinner"></div>
    <strong>{{ analysisPhase }}</strong>
    <span>Votre analyse est en cours, ne fermez pas cette page.</span>
  </div>

  <div class="error-message" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>

  <form [formGroup]="analysisForm" (ngSubmit)="submit()">
    <div class="steps" aria-label="Etapes du formulaire">
      <div class="step" [class.active]="currentStep >= 1" [class.current]="currentStep === 1">1. Projet</div>
      <div class="step" [class.active]="currentStep >= 2" [class.current]="currentStep === 2">2. Finance</div>
      <div class="step" [class.active]="currentStep >= 3" [class.current]="currentStep === 3">3. Contexte</div>
    </div>

    <app-project-section *ngIf="currentStep === 1" [form]="analysisForm"></app-project-section>
    <app-finance-section *ngIf="currentStep === 2" [form]="analysisForm"></app-finance-section>
    <app-context-section *ngIf="currentStep === 3" [form]="analysisForm"></app-context-section>

    <div class="buttons">
      <button class="back-button" type="button" *ngIf="currentStep > 1" (click)="previousStep()">&larr; Pr&eacute;c&eacute;dent</button>
      <span class="button-spacer" *ngIf="currentStep === 1"></span>
      <button class="next-button" type="button" *ngIf="currentStep < 3" (click)="nextStep()">Suivant &rarr;</button>
      <button class="submit-button" type="submit" *ngIf="currentStep === 3">Lancer l'analyse</button>
    </div>
  </form>
</div>
