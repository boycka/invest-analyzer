<div [formGroup]="form" class="section-form">
  <h2>Informations du projet</h2>

  <div class="form-group">
    <label for="sector">Secteur <span class="required">*</span></label>
    <input id="sector" type="text" formControlName="sector" placeholder="Ex : Hôtellerie" [class.invalid]="form.get('sector')?.invalid && form.get('sector')?.touched">
    <small *ngIf="form.get('sector')?.errors?.['required'] && form.get('sector')?.touched">Le secteur est obligatoire.</small>
    <small *ngIf="form.get('sector')?.errors?.['minlength'] && form.get('sector')?.touched">Minimum 3 caractères.</small>
  </div>

  <div class="form-group">
    <label for="region">Région <span class="required">*</span></label>
    <input id="region" type="text" formControlName="region" placeholder="Ex : Marrakech-Safi" [class.invalid]="form.get('region')?.invalid && form.get('region')?.touched">
    <small *ngIf="form.get('region')?.errors?.['required'] && form.get('region')?.touched">La région est obligatoire.</small>
  </div>

  <div class="form-group">
    <label for="description">Description <span class="required">*</span></label>
    <textarea id="description" rows="5" formControlName="description" placeholder="Décrivez votre projet, vos clients et votre proposition de valeur..." [class.invalid]="form.get('description')?.invalid && form.get('description')?.touched"></textarea>
    <small *ngIf="form.get('description')?.errors?.['required'] && form.get('description')?.touched">La description est obligatoire.</small>
    <small *ngIf="form.get('description')?.errors?.['minlength'] && form.get('description')?.touched">Minimum 20 caractères.</small>
  </div>

  <div class="form-group">
    <label for="stage">Stade du projet <span class="required">*</span></label>
    <select id="stage" formControlName="stage" [class.invalid]="form.get('stage')?.invalid && form.get('stage')?.touched">
      <option value="">Choisir</option>
      <option value="IDEA">Idée</option>
      <option value="PRE_STUDY">Pré-étude</option>
      <option value="STRUCTURED">Projet structuré</option>
      <option value="FUNDING">Recherche de financement</option>
    </select>
    <small *ngIf="form.get('stage')?.errors?.['required'] && form.get('stage')?.touched">Le stade est obligatoire.</small>
  </div>
</div>
